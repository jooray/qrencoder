<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QREncoder has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://cypherpunk.today/qrencoder/">
<meta http-equiv="refresh" content="0; url=https://cypherpunk.today/qrencoder/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#111}
main{padding:24px;max-width:32rem}
a{color:#0b5fd8}
@media (prefers-color-scheme:dark){body{background:#111;color:#eee}a{color:#7db2ff}}
</style>
<script>
// Send every path under /qrencoder/ to the same path on the new host, keeping query and hash.
(function () {
  var rest = location.pathname.replace(/^\/qrencoder\/?/, "");
  location.replace("https://cypherpunk.today/qrencoder/" + rest + location.search + location.hash);
})();
</script>
</head>
<body>
<main>
<p>QREncoder has moved to <a href="https://cypherpunk.today/qrencoder/">cypherpunk.today/qrencoder</a>. Redirecting.</p>
</main>
</body>
</html>
